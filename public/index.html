<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f4f1e9"><title>Arcana — Magic deckbuilder</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="dialog"></dialog>
<dialog id="commander-removal" aria-labelledby="commander-removal-title" aria-describedby="commander-removal-description">
  <h2 id="commander-removal-title"></h2>
  <p id="commander-removal-description"></p>
  <form method="dialog"><div class="workspace-actions">
    <button type="submit" class="secondary" autofocus>Keep commander</button>
    <button type="button" id="confirm-commander-removal" class="danger">Remove commander</button>
  </div></form>
  <p id="commander-removal-error" class="query-error" role="alert" hidden></p>
</dialog>
<div id="card-actions" popover="auto" role="menu" aria-label="Card actions"></div><script type="module" src="/app.js"></script></body>
</html>
